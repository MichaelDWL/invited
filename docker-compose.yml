services:
  db:
    image: postgres:17-alpine
    container_name: convite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: convite
      POSTGRES_PASSWORD: convite
      POSTGRES_DB: convite
    ports:
      # 5432 e 5433 já são usadas por outros projetos nesta máquina.
      - "127.0.0.1:5434:5432"
    volumes:
      - convite-data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convite -d convite"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  convite-data:
